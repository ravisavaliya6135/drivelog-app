    <!-- PWA Install Interception Script -->
    <script>
      window.__drivelogPwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__drivelogPwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('drivelog-pwa-prompt-available'));
      });
      window.addEventListener('appinstalled', () => {
        window.__drivelogPwaDeferredPrompt = null;
        window.dispatchEvent(new CustomEvent('drivelog-pwa-installed'));
      });
    </script>

    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How many supervised driving hours do teens need before taking the DMV road test?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most US states require 40 to 50 hours of supervised driving practice, including at least 10 hours of certified night driving (e.g. California requires 50 hours total with 10 night hours). DriveLog preconfigures legal targets for all 50 states."
          }
        },
        {
          "@type": "Question",
          "name": "Does DriveLog work completely offline while driving?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, DriveLog is an offline-first Progressive Web App (PWA). All timer calculations and trip records are securely stored on your device using IndexedDB without requiring active cellular data."
          }
        },
        {
          "@type": "Question",
          "name": "Can I export an official PDF log sheet for my DMV licensing appointment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, DriveLog compiles all practice sessions into a formatted DMV-compliant driving log PDF complete with supervisor names, dates, road conditions, and signature initials."
          }
        },
        {
          "@type": "Question",
          "name": "How does DriveLog determine legal night driving hours?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DriveLog calculates legal twilight and sunset hours based on geographic location and time of day, automatically categorizing sessions as day or night practice according to DMV standards."
          }
        }
      ]
    }
    </script>
